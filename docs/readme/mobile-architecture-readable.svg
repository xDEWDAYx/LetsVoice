<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1480" role="img" aria-labelledby="title desc">
  <title id="title">LetsVoice mobile architecture</title>
  <desc id="desc">A layered mobile architecture in which screens and hooks consume services composed by AppContainer, application and model services manage persistence and exclusive local inference, and native adapters provide runtime and audio integration.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .group { fill: #fffef0; stroke: #b59f27; stroke-width: 2; }
      .group-tag { fill: #fff7cc; stroke: #d6bd3f; stroke-width: 1.5; }
      .box { fill: #f3f0ff; stroke: #7657d5; stroke-width: 2; }
      .native { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .store { fill: #eef8ff; stroke: #2673a8; stroke-width: 2; }
      .boundary { fill: #fff7cc; stroke: #b59f27; stroke-width: 2; }
      .heading { fill: #172033; font: 700 28px Arial, sans-serif; text-anchor: middle; }
      .group-title { fill: #4b3b00; font: 700 22px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #172033; font: 20px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 17px Arial, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="canvas" width="1100" height="1480"/>
  <text class="heading" x="550" y="42">LetsVoice mobile architecture</text>

  <rect class="box" x="450" y="70" width="200" height="64" rx="12"/>
  <text class="label" x="550" y="110">User</text>

  <rect class="group" x="40" y="175" width="1020" height="240" rx="18"/>
  <rect class="group-tag" x="65" y="190" width="280" height="43" rx="10"/>
  <text class="group-title" x="205" y="219">React Native interface</text>
  <rect class="box" x="85" y="270" width="270" height="90" rx="12"/>
  <text class="label" x="220" y="307">
    <tspan x="220">Expo Router screens</tspan>
    <tspan class="small" x="220" dy="27">routes and presentation</tspan>
  </text>
  <rect class="box" x="415" y="270" width="270" height="90" rx="12"/>
  <text class="label" x="550" y="307">
    <tspan x="550">Hooks and screen-local state</tspan>
    <tspan class="small" x="550" dy="27">consume application services</tspan>
  </text>
  <rect class="box" x="745" y="270" width="270" height="90" rx="12"/>
  <text class="label" x="880" y="307">
    <tspan x="880">AppContainer singleton</tspan>
    <tspan class="small" x="880" dy="27">dependency-composition root</tspan>
  </text>
  <path class="arrow" d="M 550 134 C 510 205, 300 215, 220 270"/>
  <path class="arrow" d="M 355 315 L 415 315"/>
  <path class="dashed" d="M 745 315 L 685 315"/>

  <rect class="group" x="40" y="470" width="1020" height="405" rx="18"/>
  <rect class="group-tag" x="65" y="485" width="410" height="43" rx="10"/>
  <text class="group-title" x="270" y="514">Application services and inference</text>
  <rect class="box" x="85" y="575" width="290" height="122" rx="12"/>
  <text class="label" x="230" y="613">
    <tspan x="230">Application services</tspan>
    <tspan class="small" x="230" dy="28">notes · tasks · search</tspan>
    <tspan class="small" x="230" dy="25">Knowledge · export</tspan>
  </text>
  <rect class="boundary" x="405" y="565" width="290" height="142" rx="12"/>
  <text class="label" x="550" y="603">
    <tspan x="550">LocalLlmCoordinator</tspan>
    <tspan class="small" x="550" dy="28">FIFO queue · exclusive runtime</tspan>
    <tspan class="small" x="550" dy="25">cancellation · idle cleanup</tspan>
  </text>
  <rect class="box" x="725" y="575" width="290" height="122" rx="12"/>
  <text class="label" x="870" y="613">
    <tspan x="870">Model services</tspan>
    <tspan class="small" x="870" dy="28">STT · LLM · TTS</tspan>
    <tspan class="small" x="870" dy="25">download management</tspan>
  </text>
  <rect class="store" x="65" y="750" width="300" height="98" rx="12"/>
  <text class="label" x="215" y="787">
    <tspan x="215">Persistence services</tspan>
    <tspan class="small" x="215" dy="28">SQLite repositories · file owners</tspan>
  </text>
  <rect class="boundary" x="400" y="750" width="300" height="98" rx="12"/>
  <text class="label" x="550" y="787">
    <tspan x="550">SharedLlmContextService</tspan>
    <tspan class="small" x="550" dy="28">compatible LLM context reuse</tspan>
  </text>
  <rect class="native" x="735" y="750" width="300" height="98" rx="12"/>
  <text class="label" x="885" y="778">
    <tspan x="885">Native runtime adapters</tspan>
    <tspan class="small" x="885" dy="25">whisper.rn: Whisper + Parakeet</tspan>
    <tspan class="small" x="885" dy="23">llama.rn · sherpa-onnx</tspan>
  </text>
  <path class="arrow" d="M 550 360 C 500 455, 300 475, 230 575"/>
  <path class="dashed" d="M 880 360 C 880 455, 650 485, 550 565"/>
  <path class="arrow" d="M 375 636 L 405 636"/>
  <path class="arrow" d="M 725 636 L 695 636"/>
  <path class="arrow" d="M 230 697 L 215 750"/>
  <path class="arrow" d="M 360 697 C 390 725, 430 735, 455 750"/>
  <path class="arrow" d="M 870 697 L 885 750"/>

  <rect class="group" x="40" y="930" width="1020" height="315" rx="18"/>
  <rect class="group-tag" x="65" y="945" width="430" height="43" rx="10"/>
  <text class="group-title" x="280" y="974">Device-owned persistence and I/O</text>
  <rect class="store" x="75" y="1035" width="230" height="100" rx="12"/>
  <text class="label" x="190" y="1072">
    <tspan x="190">Expo SQLite</tspan>
    <tspan class="small" x="190" dy="28">notes · tasks · chats</tspan>
  </text>
  <rect class="store" x="335" y="1035" width="230" height="100" rx="12"/>
  <text class="label" x="450" y="1072">
    <tspan x="450">Sandbox files</tspan>
    <tspan class="small" x="450" dy="28">recordings · exports</tspan>
  </text>
  <rect class="store" x="595" y="1035" width="230" height="100" rx="12"/>
  <text class="label" x="710" y="1072">
    <tspan x="710">Model directories</tspan>
    <tspan class="small" x="710" dy="28">STT · LLM · TTS</tspan>
  </text>
  <rect class="native" x="855" y="1025" width="170" height="120" rx="12"/>
  <text class="label" x="940" y="1061">
    <tspan x="940">Native audio I/O</tspan>
    <tspan class="small" x="940" dy="28">PCM stream capture</tspan>
    <tspan class="small" x="940" dy="25">converter · PCM player</tspan>
  </text>
  <path class="arrow" d="M 185 848 C 170 920, 190 945, 190 1035"/>
  <path class="arrow" d="M 245 848 C 310 920, 450 945, 450 1035"/>
  <path class="arrow" d="M 960 697 C 1060 790, 1040 930, 710 1035"/>
  <path class="arrow" d="M 920 848 C 930 925, 940 945, 940 1025"/>

  <rect class="boundary" x="195" y="1310" width="710" height="112" rx="12"/>
  <text class="label" x="550" y="1348">
    <tspan x="550">Independent mobile boundary</tspan>
    <tspan class="small" x="550" dy="29">own database · model store · dependencies · release path</tspan>
    <tspan class="small" x="550" dy="25">no desktop IPC, shared runtime, or built-in synchronisation</tspan>
  </text>
  <path class="dashed" d="M 550 1245 L 550 1310"/>
</svg>
