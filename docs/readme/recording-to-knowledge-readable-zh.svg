<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1630" role="img" aria-labelledby="title desc">
  <title id="title">录音到可检索知识的处理流水线</title>
  <desc id="desc">从麦克风或导入音频开始，经过转写、本地结构化提取、复核、持久化与索引的纵向流程图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .box { fill: #f3f0ff; stroke: #7657d5; stroke-width: 2; }
      .store { fill: #eef8ff; stroke: #2673a8; stroke-width: 2; }
      .heading { fill: #172033; font: 700 28px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .label { fill: #172033; font: 20px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 17px "Microsoft YaHei", "PingFang SC", sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="canvas" width="1100" height="1630"/>
  <text class="heading" x="550" y="42">从录音到可检索知识</text>

  <rect class="box" x="425" y="70" width="250" height="68" rx="12"/>
  <text class="label" x="550" y="112">声音来源</text>

  <rect class="box" x="110" y="205" width="250" height="68" rx="12"/>
  <text class="label" x="235" y="247">麦克风</text>
  <rect class="box" x="740" y="205" width="250" height="68" rx="12"/>
  <text class="label" x="865" y="247">本地音频文件</text>
  <rect class="box" x="110" y="335" width="250" height="68" rx="12"/>
  <text class="label" x="235" y="377">MediaRecorder</text>
  <rect class="box" x="700" y="325" width="330" height="88" rx="12"/>
  <text class="label" x="865" y="359">
    <tspan x="865">文件选择与</tspan>
    <tspan x="865" dy="28">格式检查</tspan>
  </text>
  <path class="arrow" d="M 500 138 C 460 170, 330 175, 235 205"/>
  <path class="arrow" d="M 600 138 C 640 170, 770 175, 865 205"/>
  <path class="arrow" d="M 235 273 L 235 335"/>
  <path class="arrow" d="M 865 273 L 865 325"/>

  <rect class="store" x="70" y="470" width="250" height="88" rx="12"/>
  <text class="label" x="195" y="507">
    <tspan x="195">blobs/recordings</tspan>
    <tspan class="small" x="195" dy="25">已保存音频</tspan>
  </text>
  <rect class="box" x="385" y="455" width="330" height="118" rx="12"/>
  <text class="label" x="550" y="492">
    <tspan x="550">Whisper / Parakeet</tspan>
    <tspan x="550" dy="28">必要时进行 FFmpeg</tspan>
    <tspan x="550" dy="28">音频预处理</tspan>
  </text>
  <path class="arrow" d="M 235 403 C 235 430, 310 430, 410 455"/>
  <path class="arrow" d="M 865 413 C 820 440, 720 445, 690 455"/>
  <path class="dashed" d="M 200 403 L 195 470"/>
  <path class="dashed" d="M 800 413 C 650 440, 390 430, 320 492"/>

  <rect class="box" x="400" y="640" width="300" height="72" rx="12"/>
  <text class="label" x="550" y="684">Transcript</text>
  <path class="arrow" d="M 550 573 L 550 640"/>

  <rect class="box" x="365" y="780" width="370" height="104" rx="12"/>
  <text class="label" x="550" y="817">
    <tspan x="550">本地 LLM 生成</tspan>
    <tspan x="550" dy="28">Structured Note Draft</tspan>
  </text>
  <path class="arrow" d="M 550 712 L 550 780"/>

  <rect class="box" x="350" y="950" width="400" height="104" rx="12"/>
  <text class="label" x="550" y="987">
    <tspan x="550">复核弹窗</tspan>
    <tspan x="550" dy="28">draft.summary + 原文</tspan>
  </text>
  <path class="arrow" d="M 550 884 L 550 950"/>

  <rect class="box" x="330" y="1120" width="440" height="82" rx="12"/>
  <text class="label" x="550" y="1170">Workspace.saveTranscriptionNote</text>
  <path class="arrow" d="M 550 1054 L 550 1120"/>

  <rect class="store" x="425" y="1270" width="250" height="72" rx="12"/>
  <text class="label" x="550" y="1314">notes</text>
  <path class="arrow" d="M 550 1202 L 550 1270"/>

  <rect class="store" x="45" y="1400" width="270" height="72" rx="12"/>
  <text class="label" x="180" y="1444">structured_notes</text>
  <rect class="store" x="415" y="1388" width="270" height="96" rx="12"/>
  <text class="label" x="550" y="1425">
    <tspan x="550">todos</tspan>
    <tspan class="small" x="550" dy="25">后台提取</tspan>
  </text>
  <rect class="box" x="770" y="1388" width="285" height="96" rx="12"/>
  <text class="label" x="912" y="1423">
    <tspan x="912">选择内置或</tspan>
    <tspan x="912" dy="28">自定义模板</tspan>
  </text>
  <path class="arrow" d="M 490 1342 C 430 1365, 300 1368, 180 1400"/>
  <path class="dashed" d="M 550 1342 L 550 1388"/>
  <path class="arrow" d="M 610 1342 C 690 1360, 790 1365, 850 1388"/>

  <rect class="store" x="770" y="1530" width="285" height="72" rx="12"/>
  <text class="label" x="912" y="1574">scenario_knowledge</text>
  <rect class="store" x="300" y="1530" width="340" height="72" rx="12"/>
  <text class="label" x="470" y="1574">全文 / 语义索引</text>
  <path class="arrow" d="M 912 1484 L 912 1530"/>
  <path class="arrow" d="M 180 1472 C 220 1510, 320 1515, 390 1530"/>
  <path class="arrow" d="M 550 1484 L 510 1530"/>
  <path class="arrow" d="M 770 1566 L 640 1566"/>
</svg>
