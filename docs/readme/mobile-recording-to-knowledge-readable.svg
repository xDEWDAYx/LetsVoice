<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1900" role="img" aria-labelledby="title desc">
  <title id="title">LetsVoice capture-to-knowledge pipeline</title>
  <desc id="desc">A vertical flow from microphone or imported audio through native preparation, on-device transcription, review, save-first persistence, structured generation, and local note tools.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .box { fill: #f3f0ff; stroke: #7657d5; stroke-width: 2; }
      .native { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
      .store { fill: #eef8ff; stroke: #2673a8; stroke-width: 2; }
      .note { fill: #fff7cc; stroke: #b59f27; stroke-width: 2; }
      .heading { fill: #172033; font: 700 28px Arial, sans-serif; text-anchor: middle; }
      .label { fill: #172033; font: 20px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 17px Arial, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="canvas" width="1100" height="1900"/>
  <text class="heading" x="550" y="42">LetsVoice: from audio to local knowledge</text>

  <rect class="box" x="425" y="70" width="250" height="68" rx="12"/>
  <text class="label" x="550" y="112">Audio source</text>

  <rect class="box" x="100" y="205" width="270" height="68" rx="12"/>
  <text class="label" x="235" y="247">Microphone</text>
  <rect class="box" x="730" y="205" width="270" height="68" rx="12"/>
  <text class="label" x="865" y="247">Imported audio</text>
  <path class="arrow" d="M 500 138 C 460 170, 330 175, 235 205"/>
  <path class="arrow" d="M 600 138 C 640 170, 770 175, 865 205"/>

  <rect class="native" x="320" y="340" width="460" height="105" rx="12"/>
  <text class="label" x="550" y="378">
    <tspan x="550">Native capture and preparation</tspan>
    <tspan class="small" x="550" dy="28">PCM capture · conversion · Apple-only session events</tspan>
  </text>
  <path class="arrow" d="M 235 273 C 250 315, 390 315, 440 340"/>
  <path class="arrow" d="M 865 273 C 850 315, 710 315, 660 340"/>

  <rect class="box" x="325" y="520" width="450" height="118" rx="12"/>
  <text class="label" x="550" y="558">
    <tspan x="550">Selected on-device STT</tspan>
    <tspan x="550" dy="29">Whisper multilingual or Parakeet English</tspan>
    <tspan class="small" x="550" dy="26">session keeps its starting model</tspan>
  </text>
  <path class="arrow" d="M 550 445 L 550 520"/>

  <rect class="note" x="805" y="500" width="255" height="150" rx="12"/>
  <text class="label" x="932" y="539">
    <tspan x="932">Model download</tspan>
    <tspan x="932" dy="29">needs network</tspan>
    <tspan class="small" x="932" dy="28">inference remains local</tspan>
  </text>
  <path class="dashed" d="M 805 575 L 775 575"/>

  <rect class="box" x="385" y="710" width="330" height="76" rx="12"/>
  <text class="label" x="550" y="756">Transcript review</text>
  <path class="arrow" d="M 550 638 L 550 710"/>

  <rect class="store" x="320" y="860" width="460" height="112" rx="12"/>
  <text class="label" x="550" y="898">
    <tspan x="550">Save raw Note and audio first</tspan>
    <tspan class="small" x="550" dy="29">SQLite record + sandbox file</tspan>
    <tspan class="small" x="550" dy="25">captured content survives later generation failure</tspan>
  </text>
  <path class="arrow" d="M 550 786 L 550 860"/>

  <rect class="box" x="55" y="1050" width="270" height="110" rx="12"/>
  <text class="label" x="190" y="1086">
    <tspan x="190">Structured Note + tasks</tspan>
    <tspan class="small" x="190" dy="28">automatic after save</tspan>
    <tspan class="small" x="190" dy="25">streamed foreground output</tspan>
  </text>
  <rect class="box" x="415" y="1050" width="270" height="110" rx="12"/>
  <text class="label" x="550" y="1086">
    <tspan x="550">Knowledge</tspan>
    <tspan class="small" x="550" dy="28">scenario or selected template</tspan>
    <tspan class="small" x="550" dy="25">separate local request</tspan>
  </text>
  <rect class="box" x="775" y="1050" width="270" height="110" rx="12"/>
  <text class="label" x="910" y="1086">
    <tspan x="910">Translation</tspan>
    <tspan class="small" x="910" dy="28">user-selected section</tspan>
    <tspan class="small" x="910" dy="25">separate local request</tspan>
  </text>
  <path class="arrow" d="M 470 972 C 420 1010, 280 1015, 190 1050"/>
  <path class="arrow" d="M 550 972 L 550 1050"/>
  <path class="arrow" d="M 630 972 C 680 1010, 820 1015, 910 1050"/>

  <rect class="note" x="20" y="1230" width="270" height="135" rx="12"/>
  <text class="label" x="155" y="1265">
    <tspan x="155">LocalLlmCoordinator</tspan>
    <tspan class="small" x="155" dy="27">FIFO exclusivity</tspan>
    <tspan class="small" x="155" dy="24">cancel · idle cleanup</tspan>
  </text>
  <rect class="note" x="810" y="1230" width="270" height="135" rx="12"/>
  <text class="label" x="945" y="1265">
    <tspan x="945">SharedLlmContextService</tspan>
    <tspan class="small" x="945" dy="27">compatible LLM reuse</tspan>
    <tspan class="small" x="945" dy="24">separate lifecycle service</tspan>
  </text>

  <rect class="store" x="320" y="1250" width="460" height="95" rx="12"/>
  <text class="label" x="550" y="1288">
    <tspan x="550">Saved local note workspace</tspan>
    <tspan class="small" x="550" dy="29">generated content remains linked to its note</tspan>
  </text>
  <path class="arrow" d="M 190 1160 C 240 1205, 365 1210, 430 1250"/>
  <path class="arrow" d="M 550 1160 L 550 1250"/>
  <path class="arrow" d="M 910 1160 C 860 1205, 735 1210, 670 1250"/>

  <rect class="box" x="70" y="1480" width="230" height="112" rx="12"/>
  <text class="label" x="185" y="1518">
    <tspan x="185">Fuzzy search</tspan>
    <tspan class="small" x="185" dy="28">titles and text</tspan>
  </text>
  <rect class="box" x="320" y="1480" width="230" height="112" rx="12"/>
  <text class="label" x="435" y="1518">
    <tspan x="435">Scoped Ask AI</tspan>
    <tspan class="small" x="435" dy="28">up to three notes</tspan>
  </text>
  <rect class="box" x="570" y="1480" width="210" height="112" rx="12"/>
  <text class="label" x="675" y="1518">
    <tspan x="675">PDF export</tspan>
    <tspan class="small" x="675" dy="28">one note</tspan>
  </text>
  <rect class="box" x="800" y="1480" width="230" height="112" rx="12"/>
  <text class="label" x="915" y="1518">
    <tspan x="915">Local TTS</tspan>
    <tspan class="small" x="915" dy="28">native PCM playback</tspan>
  </text>
  <path class="arrow" d="M 430 1345 C 390 1420, 260 1435, 185 1480"/>
  <path class="arrow" d="M 505 1345 L 435 1480"/>
  <path class="arrow" d="M 595 1345 L 675 1480"/>
  <path class="arrow" d="M 670 1345 C 710 1420, 840 1435, 915 1480"/>

  <rect class="note" x="245" y="1740" width="610" height="66" rx="12"/>
  <text class="label" x="550" y="1782">Independent mobile data and runtimes · no desktop sync</text>
  <path class="dashed" d="M 550 1592 L 550 1740"/>
</svg>
